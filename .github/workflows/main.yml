name: CI Pipeline

on:
  push:
    branches:
      - focal
  pull_request:
    branches:
      - focal

env:
  DOCKER_DRIVER: overlay2
  UT_VERSION: '20.04'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint python3-pip

      - name: Run yamllint in Docker
        run: |
          docker run --rm -v $(pwd):/mnt cytopia/yamllint:latest -s .

      - name: Run black
        run: |
          docker run --rm -v $(pwd):/mnt cytopia/black:latest /bin/ash -c "black --diff /mnt && black --check -v /mnt"

      - name: Run shellcheck
        run: |
          docker run --rm -v $(pwd):/mnt cypress/included:latest /bin/bash -c 'shellcheck --version && find . -type f \( -iname \*.sh -o -iname \*.bash -o -iname \*.ksh \) | xargs shellcheck'

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        architecture: [amd64, arm64, armhf]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build for architecture ${{ matrix.architecture }}
        run: |
          if [ "${{ matrix.architecture }}" == "amd64" ]; then
            docker build --platform linux/amd64 -t clickable/ci-${{ env.UT_VERSION }}-amd64 .
            docker run --rm clickable/ci-${{ env.UT_VERSION }}-amd64 clickable build
            docker save clickable/ci-${{ env.UT_VERSION }}-amd64 > build/x86_64-linux-gnu/app/*.click
          elif [ "${{ matrix.architecture }}" == "arm64" ]; then
            docker build --platform linux/arm64 -t clickable/ci-${{ env.UT_VERSION }}-arm64 .
            docker run --rm clickable/ci-${{ env.UT_VERSION }}-arm64 clickable build
            docker save clickable/ci-${{ env.UT_VERSION }}-arm64 > build/aarch64-linux-gnu/app/*.click
          else
            docker build --platform linux/armhf -t clickable/ci-${{ env.UT_VERSION }}-armhf .
            docker run --rm clickable/ci-${{ env.UT_VERSION }}-armhf clickable build
            docker save clickable/ci-${{ env.UT_VERSION }}-armhf > build/arm-linux-gnueabihf/app/*.click
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: clickable-artifacts
          path: |
            build/x86_64-linux-gnu/app/*.click
            build/aarch64-linux-gnu/app/*.click
            build/arm-linux-gnueabihf/app/*.click
